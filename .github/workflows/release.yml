name: Release

# Manual, one-button release. Versions are calver (YYYY.MM.PATCH); year/month come
# from the current UTC date automatically, so the only choice is stable vs candidate.
# The job bumps version.properties, builds a signed universal APK, and ONLY THEN
# commits + tags it and publishes a draft GitHub Release with auto-generated notes —
# so a failed build never leaves an orphaned tag or a burned version on the branch.
# Review the draft, then publish it; Obtainium/IzzyOnDroid pick up published releases.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type (patch ships YYYY.MM.PATCH from today's UTC date; prepatch starts an -rc, rc advances it, finalize promotes to stable)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - prepatch
          - rc
          - finalize

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # push the version-bump commit + tag, and create the Release
  id-token: write       # OIDC identity for keyless Sigstore signing of the attestation
  attestations: write   # write the build-provenance attestation to the repo's attestation store

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    # Gate signing secrets behind a protected environment (add required reviewers in repo
    # settings). Secrets are unavailable to fork PRs, so this stays off the PR path.
    environment: release
    # Surface the bumped version + tag so the secondary `ios` job can check out the tagged
    # commit and name/upload its IPA against the same draft release.
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for auto-generated release notes
          # Pushing the bump commit + tag to the ruleset-protected default branch needs an
          # actor that bypasses the ruleset. The github-actions bot can't be a bypass actor
          # on a personal (non-org) repo, so authenticate as the repo owner via a
          # fine-grained PAT (Contents: write) — already a bypass actor. Set in the
          # 'release' environment. checkout persists it for the later push.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        # Pinned to a commit SHA (not a moving tag) so a compromise of the action's
        # repo can't inject code into this secret-bearing job. Dependabot keeps it
        # current — see .github/dependabot.yml.
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Fail in seconds if the signing secrets are missing/blank, before doing any
      # work — rather than deep inside the Gradle signing task after a full build.
      - name: Verify signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          missing=""
          [ -z "$SIGNING_KEYSTORE_BASE64" ] && missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -z "$SIGNING_STORE_PASSWORD" ] && missing="$missing SIGNING_STORE_PASSWORD"
          [ -z "$SIGNING_KEY_PASSWORD" ] && missing="$missing SIGNING_KEY_PASSWORD"
          [ -z "$SIGNING_KEY_ALIAS" ] && missing="$missing SIGNING_KEY_ALIAS"
          # PAT used by checkout to push past the branch ruleset (see Checkout step).
          [ -z "$RELEASE_PAT" ] && missing="$missing RELEASE_PAT"
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Set these in the 'release' environment:$missing"
            exit 1
          fi

      - name: Bump version
        id: bump
        run: ./scripts/bump-version.sh "${{ inputs.bump }}"

      # Same source of truth the app reads (core/common codegen) — surfaced in the
      # release notes so users know which LibreChat backend this build targets.
      - name: Read backend target version
        id: backend
        run: |
          v="$(grep '^backendTargetVersion=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "target=$v" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The baked backend commit→version table (BackendCommitMap.kt) is NOT regenerated here — it is
      # committed by /sync-upstream. Regenerating at release time was removed deliberately: it needs
      # the upstream submodule, and a shallow/partial checkout could regenerate a DEGRADED (smaller)
      # table and silently ship it — worse than the PR-reviewed committed table.
      #
      # Instead, gate the release on the committed table containing the pinned backend commit. PR CI
      # verifies this more strictly (BackendCommitMapFreshnessTest — presence AND correct version);
      # this cheap re-check closes the window where a release is dispatched before/independently of a
      # green develop CI run. Pure file read (no submodule, no compile, no test framework), so it
      # can't hard-fail on a shallow checkout or a test rename — it fails only if the committed table
      # genuinely lacks the pinned commit.
      - name: Verify backend commit map is fresh
        run: |
          commit="$(grep '^commit=' UPSTREAM_VERSION | cut -d= -f2 | tr -d '[:space:]')"
          map="core/common/src/commonMain/kotlin/com/garfiec/librechat/core/common/generated/BackendCommitMap.kt"
          # The table keys commits by their first 12 hex chars (PREFIX_LEN in generateBackendCommitMap).
          if ! grep -q "^${commit:0:12} " "$map"; then
            echo "::error::$map is missing pinned commit ${commit:0:12} — run ./gradlew generateBackendCommitMap and commit it."
            exit 1
          fi

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.bump.outputs.version_name }}
        run: |
          src="app/build/outputs/apk/release/app-release.apk"
          out="librechat-v${VERSION}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "${out}.sha256"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      # Sign a SLSA provenance attestation for the published APK (keyless, via Sigstore +
      # Rekor). This is the only check that resists a tampered upload — unlike the .sha256,
      # it can't be forged outside GitHub's CI. Runs on the renamed artifact so the attested
      # subject name matches the downloaded asset (verification is by digest regardless).
      - name: Attest build provenance
        id: attest
        # GitHub-owned action → moving major tag, consistent with actions/checkout@v7 and
        # actions/setup-java@v5; Dependabot tracks it via .github/dependabot.yml.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.artifacts.outputs.apk }}

      # Commit + tag the bump ONLY after a signed APK exists, so a failed build never
      # leaves an orphaned tag or a burned version on the branch. --atomic makes the
      # branch push and the tag push all-or-nothing.
      - name: Commit, tag & push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/$TAG"

      # Assemble the full release body ourselves so we can put shields.io badges at the
      # very TOP — above GitHub's auto-changelog. The action's append_body can only append
      # AFTER the generated notes, never prepend, so we generate the notes via the API and
      # stitch the final body in order: badges → changelog → provenance footer.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          BACKEND: ${{ steps.backend.outputs.target }}
          APK: ${{ steps.artifacts.outputs.apk }}
          VERSION: ${{ steps.bump.outputs.version_name }}
        run: |
          # Generate the same changelog GitHub would auto-produce. Omitting previous_tag_name
          # lets the API auto-detect the prior tag, matching the old generate_release_notes.
          gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > "$RUNNER_TEMP/changelog.md"

          # The iOS job uploads this deterministic asset name to the same draft; reference it
          # statically here even though this step runs before that job finishes.
          IPA="librechat-v${VERSION}.ipa"

          # Badge row (rendered side-by-side). The Target Backend badge replaces the old
          # plain-text "Target backend: LibreChat v…" line. The Downloads badges track
          # download counts for this release's APK / IPA assets.
          {
            printf '![Target Backend](https://img.shields.io/badge/Target_Backend-LibreChat_v%s-orange)' "$BACKEND"
            printf ' '
            printf '![APK Downloads](https://img.shields.io/github/downloads/garfiec/Librechat-Mobile/%s/%s?displayAssetName=false&logo=android&label=APK%%20Downloads&color=blue)' "$TAG" "$APK"
            printf ' '
            printf '![IPA Downloads](https://img.shields.io/github/downloads/garfiec/Librechat-Mobile/%s/%s?displayAssetName=false&logo=apple&label=IPA%%20Downloads&color=blue)\n' "$TAG" "$IPA"
            printf '\n'
            cat "$RUNNER_TEMP/changelog.md"
            # Slim provenance footer: discoverability links, not proof. Canonical "how to
            # verify a download" instructions live in docs/RELEASING.md + README.
            printf '\n\n---\n'
            printf '[Build provenance attestation](%s) · [CI workflow run](%s/%s/actions/runs/%s)\n' \
              "${{ steps.attest.outputs.attestation-url }}" \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"
          } > "$RUNNER_TEMP/body.md"

      - name: Create draft release
        # Pinned to a commit SHA (not a moving tag): this step runs with a
        # contents:write token, so a hijacked tag could push tags/releases on our
        # behalf. Dependabot bumps the pin — see .github/dependabot.yml.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          draft: true
          # A hyphenated version (e.g. 2026.07.1-rc1) is a pre-release; Obtainium then
          # ignores it unless the user opts into "Include prereleases".
          prerelease: ${{ contains(steps.bump.outputs.tag, '-') }}
          # We pre-assemble the full body (badges → changelog → footer) in the previous
          # step, so disable the action's own note generation/append.
          generate_release_notes: false
          append_body: false
          body_path: ${{ runner.temp }}/body.md
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.apk }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remind to publish the draft
        run: |
          echo "::warning title=Release is a DRAFT::${{ steps.bump.outputs.tag }} was created as a DRAFT. Obtainium and direct downloads will NOT see it until you open it in the GitHub Releases UI and click Publish."

  # Secondary, NON-BLOCKING iOS job: builds an UNSIGNED, device-arch IPA from the just-tagged
  # commit and attaches it to the same draft release. It needs no secrets and no Apple account
  # — sideload installers (AltStore/SideStore/Sideloadly) re-sign with the user's free Apple ID,
  # and TrollStore/jailbreak installers accept unsigned IPAs directly. If this macOS job fails,
  # the Android release (tag + APK + draft) already stands; just re-run it or upload manually.
  ios:
    name: Build & attach unsigned IPA
    needs: release
    runs-on: macos-latest
    # No `environment: release` — this job uses no signing secrets. It inherits the
    # workflow-level permissions (contents: write to upload the asset; id-token/attestations
    # for provenance parity with the APK).
    steps:
      - name: Checkout (tagged commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}   # the bump commit the release job just pushed

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        # SHA-pinned to match the release job's supply-chain policy (Dependabot bumps it).
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      # The Kotlin framework is built by the Xcode "Compile Kotlin Framework" build phase
      # (./gradlew :shared:embedAndSignAppleFrameworkForXcode), which runs inside the
      # archive below — no separate link step needed. Direct integration; see iosApp/README.md.
      - name: Archive & package unsigned IPA
        id: ipa
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version_name }}
        run: |
          set -euo pipefail
          # Unsigned device archive. Signing is fully disabled: the project's Release config
          # carries an sdk-scoped `CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Development"` +
          # `CODE_SIGN_STYLE = Automatic`, which on a device archive would otherwise demand a
          # provisioning profile on this account-less runner — so we override the sdk-scoped
          # key, force Manual style, and blank the profile, not just the unscoped identity.
          # The "Compile Kotlin Framework" build phase shells out to ./gradlew itself
          # (embedAndSignAppleFrameworkForXcode, which also syncs Compose resources), which
          # is why JDK + Gradle are set up above.
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" "CODE_SIGN_IDENTITY[sdk=iphoneos*]=" \
            CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" ONLY_ACTIVE_ARCH=NO

          # Repackage the archived .app into an unsigned IPA (Payload/ + zip).
          cd "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications"
          mkdir -p Payload && mv iosApp.app Payload/
          OUT="$RUNNER_TEMP/librechat-v${VERSION}.ipa"
          zip -qry "$OUT" Payload
          ( cd "$RUNNER_TEMP" && shasum -a 256 "librechat-v${VERSION}.ipa" > "librechat-v${VERSION}.ipa.sha256" )
          echo "ipa=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$OUT.sha256" >> "$GITHUB_OUTPUT"

      # Provenance parity with the APK: a keyless SLSA attestation for the IPA bytes.
      # Non-fatal: this needs the runner's OIDC token endpoint, which occasionally
      # fails to resolve (transient getaddrinfo ENOTFOUND). Attestation is a nice-to-have
      # for the sideload IPA — it must not skip the upload step that follows and cost us
      # the actual deliverable. The APK remains the primary attested artifact.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.ipa.outputs.ipa }}

      - name: Upload IPA to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "${{ steps.ipa.outputs.ipa }}" \
            "${{ steps.ipa.outputs.sha }}" --clobber
